name: Build

on:
  push:
    branches:
      - main
      - 'nextgen-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show toolchain
        shell: bash
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        run: dotnet restore NextGen-Emulator.sln

      - name: Build
        run: dotnet build NextGen-Emulator.sln --configuration Release --no-restore

      - name: Run Quest script audit
        shell: bash
        run: python3 tools/audit-quest-script-interpreter.py
